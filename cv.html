<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0a0b;--panel:#151013;--panel2:#1d1519;--line:#2e2026;--text:#f5eef0;--muted:#a8959b;--red:#ef4444;--red2:#b91c1c;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
body{min-height:100vh;background:var(--bg);background-image:linear-gradient(rgba(239,68,68,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(239,68,68,.05) 1px,transparent 1px);background-size:28px 28px;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:32px 16px 40px}
.wrap{width:100%;max-width:760px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 70px -25px rgba(239,68,68,.35)}
.bar{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#110c0e;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--muted)}
.bar i{width:11px;height:11px;border-radius:50%;background:#3a2a30}.bar i:first-child{background:var(--red)}
.bar span{margin-left:6px}
.head{padding:22px 22px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line)}
.head .cmd{font-family:var(--mono);font-size:13px;color:var(--muted)}.head .cmd em{color:var(--red);font-style:normal}
h1{font-size:24px;font-weight:800;margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.a{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;text-decoration:none;color:var(--text);background:var(--panel2);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.a:hover{border-color:var(--red);transform:translateY(-2px)}
.a.main{background:linear-gradient(135deg,var(--red),var(--red2));border-color:transparent;color:#fff}
.a svg{width:16px;height:16px}
.sheet{padding:20px}
.sheet a{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.sheet img{display:block;width:100%;height:auto;background:#fff}
footer{display:flex;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:#7a6a70;background:#110c0e}
footer a{color:inherit}
</style>
</head>
<body>
<main class="wrap">
  <div class="bar"><i></i><i></i><i></i><span>erwan@geneva:~/cv</span></div>
  <section class="head">
    <div>
      <div class="cmd"><em>$</em> cat cv.pdf</div>
      <h1>CV — Erwan Omorodion</h1>
    </div>
    <div class="actions">
      <a class="a main" href="CV_Erwan_Omorodion.pdf" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Télécharger (PDF)</a>
      <a class="a" href="CV_Erwan_Omorodion.pdf" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>Ouvrir</a>
    </div>
  </section>
  <section class="sheet">
    <a href="CV_Erwan_Omorodion.pdf" target="_blank" rel="noopener"><img src="cv.jpg" alt="CV d'Erwan Omorodion" width="1200" height="1697"></a>
  </section>
  <footer><a href="./">← carte de visite</a><span>erwanomr.github.io</span></footer>
</main>
</body>
